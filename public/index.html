<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Movie Server</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <a href="/">🎬 Movie Server</a>
    </div>

    <form id="searchForm" class="search-bar">
      <select id="categorySelect">
        <option value="phim-moi-cap-nhat">Phim mới</option>
        <option value="phim-le">Phim lẻ</option>
        <option value="phim-bo">Phim bộ</option>
        <option value="tv-shows">TV Shows</option>
      </select>

      <input type="text" id="searchInput" placeholder="Tìm phim..." />
      <button type="submit">🔍</button>
    </form>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container">
    <h2 id="page-title">Phim mới cập nhật</h2>
    <div id="movie-list"></div>
    <div id="pagination"></div>
    <div id="movie-detail" style="display:none;"></div>
  </main>

  <!-- SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="phimapi-full.js"></script>

</body>
</html>
