<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Movie Server</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <a href="/">🎬 Movie Server</a>
    </div>
    <div class="filters">

      <select id="type">
      <option value="">Loại phim</option>
      <option value="phim-le">Phim lẻ</option>
      <option value="phim-bo">Phim bộ</option>
      <option value="hoat-hinh">Anime</option>
      </select>

      <select id="genre">
      <option value="">Thể loại</option>
      <option value="hanh-dong">Hành động</option>
      <option value="tinh-cam">Tình cảm</option>
      <option value="hai-huoc">Hài</option>
      <option value="kinh-di">Kinh dị</option>
      </select>

      <select id="country">
      <option value="">Quốc gia</option>
      <option value="han-quoc">Hàn Quốc</option>
      <option value="trung-quoc">Trung Quốc</option>
      <option value="my">Mỹ</option>
      <option value="nhat-ban">Nhật Bản</option>
      </select>

      <select id="year">
      <option value="">Năm</option>
      <option>2025</option>
      <option>2024</option>
      <option>2023</option>
      </select>

      <input id="search" placeholder="Tìm phim">

      <button onclick="applyFilter()">Lọc</button>

    </div>
  </header>


  <!-- MAIN CONTENT -->
  <main class="container">
    <h2 id="page-title">Phim mới cập nhật</h2>
    <div id="movie-list"></div>
    <div id="pagination"></div>
    <div id="movie-detail" style="display:none;"></div>

    
  </main>


  <!-- SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="phimapi-full.js"></script>

</body>
</html>
