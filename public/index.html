<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Movie Server</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <a href="/">🎬 Movie Server</a>
    </div>
    <div class="filters">

      <select id="type" data-placeholder="Loại phim"></select>
      <select id="genre" data-placeholder="Thể loại"></select>
      <select id="country" data-placeholder="Quốc gia"></select>
      <select id="year" data-placeholder="Năm"></select>

      <input id="search" placeholder="Tìm phim">

      <button onclick="applyFilter()">Lọc</button>

    </div>
  </header>


  <!-- MAIN CONTENT -->
  <main class="container">
    <h2 id="page-title">Phim mới cập nhật</h2>
    <div id="movie-list"></div>
    <div id="pagination"></div>
    <div id="movie-detail" style="display:none;"></div>

    
  </main>


  <!-- SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="phimapi-full.js"></script>

</body>
</html>
